spring:
  application:
    name: CarDiag
  datasource:
    url: jdbc:postgresql://localhost:5432/cardiag
    username: pcodes
    password: pcodes
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 100
          batch_versioned_data: true
        order_updates: true
        order_inserts: true

    database: PostgreSQL
  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 50MB
springdoc:
  default-produces-media-type: application/json

application:
  file:
    uploads:
      media-output-path: ./uploads

  embedding:
    enabled: true
  ingestion:
    enabled: true
    json-path: src/main/resources/fault.json
  security:
    jwt:
      secret: 8wWYjFpCy6Otp48mdnWDgkTjt5IjPPJqAKpqKhzAEZM=
      expiration: 86400000 #1day
      refresh-token:
        expiration: 604800000 #7 days
  voyage:
    ai:
      api-key: ${VOYAGE_API_KEY}
      url: https://api.voyageai.com/
      model: voyage-3
  youtube:
    api:
      key: ${YOUTUBE_API_KEY}
      base-url: https://www.googleapis.com
      results-per-fault: 3
      cache-ttl-days: 7

  cardiag:
    vector:
      dimensions: 768
      similarity-threshold: 0.75
      top-k: 3
    cache:
      embedding-ttl-seconds: 86400
      diagnosis-ttl-seconds: 3600
      youtube-ttl-seconds: 604800
